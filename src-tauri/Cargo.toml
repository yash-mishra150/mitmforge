[package]
name = "mitmforge"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mitmforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async network engine + MITM proxy (hudsucker re-exports rcgen, rustls, hyper)
tokio = { version = "1", features = ["full"] }
hudsucker = "0.25"

# Typed IPC bindings — pinned RC (rc.26 pairs with current tauri 2.x command macros)
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
thiserror = "2"
tauri-plugin-single-instance = "2"

# Body capture (hudsucker re-exports hyper but not http-body-util)
http-body-util = "0.1"

# System monitoring
sysinfo = "0.30"

# Windows-only extended TCP table for client process attribution
windows-sys = { version = "0.52", features = ["Win32_NetworkManagement_IpHelper", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
winapi = { version = "0.3", features = ["wininet"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
